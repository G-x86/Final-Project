name: MCP dev-assistant CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: 1 # บังคับ stdout UTF-8 กันพิมพ์ไทยพังบน console cp1252
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ติดตั้ง dependency
        run: pip install "mcp[cli]" pytest

      - name: self-check ตรรกะ tools (offline)
        run: python tools.py

      - name: smoke test MCP protocol
        run: python clients/smoke_test.py

      - name: eval 12 งาน
        run: python eval/eval.py --no-color

      - name: เก็บบันทึกไว้ตรวจย้อนหลัง
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-logs
          if-no-files-found: warn
          path: |
            eval/results.md
            eval/eval_runs.jsonl
          retention-days: 30
